<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#09060a" />
  <meta name="description" content="用手势唤醒一颗为你而来的心。" />
  <title>给特别的你 · 心动粒子</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="experience" aria-label="手势控制的心动粒子">
    <canvas id="particleCanvas" aria-hidden="true"></canvas>
    <div class="grain" aria-hidden="true"></div>
    <div class="ambient-layer" id="ambientLayer" aria-hidden="true">
      <div class="aurora aurora-a"></div><div class="aurora aurora-b"></div>
      <div class="orbit orbit-a"></div><div class="orbit orbit-b"></div>
      <div class="ambient-stars" id="ambientStars"></div>
      <div class="petal-field" id="petalField"></div>
      <div class="meteor-field" id="meteorField"></div>
    </div>

    <section class="intro" id="intro">
      <p class="eyebrow">A LITTLE UNIVERSE · JUST FOR YOU</p>
      <h1>把手伸向<br /><em>这颗心</em></h1>
      <p class="intro-copy">捏合指尖，让星光聚成心意；<br />张开手掌绽放星河，握拳切换惊喜。<br /><span>让照片与一段只属于你们的旋律慢慢出现。</span></p>
      <button class="primary" id="startButton" type="button">
        <span>开启心动</span><i aria-hidden="true">♡</i>
      </button>
      <p class="privacy">摄像头画面仅在你的设备上用于手势识别，不会被上传或保存</p>
    </section>

    <section class="dedication" id="dedication" aria-live="polite">
      <p class="eyebrow">TO <span id="toName">特别的你</span></p>
      <h2 id="message">见到你的那一刻，<br />星星都落进了心里。</h2>
      <p class="signature">— <span id="fromName">一个想把浪漫送给你的人</span></p>
    </section>

    <section class="memory-stage" id="memoryStage" aria-label="照片回忆">
      <figure class="memory-card memory-main">
        <img src="./assets/photos/memory-phone.jpg" alt="她的照片" />
        <figcaption><span>01</span><em>一眼心动</em></figcaption>
      </figure>
      <figure class="memory-card memory-crop crop-one"><figcaption><span>02</span><em>想把每个瞬间收藏</em></figcaption></figure>
      <figure class="memory-card memory-crop crop-two"><figcaption><span>03</span><em>关于你的温柔</em></figcaption></figure>
      <figure class="memory-card memory-crop crop-three"><figcaption><span>04</span><em>是我偏爱的画面</em></figcaption></figure>
    </section>

    <div class="love-whisper" id="loveWhisper" aria-live="polite">
      <span>✦</span><p>喜欢，是藏不住的星光。</p><span>✦</span>
    </div>

    <div class="shape-picker" id="shapePicker" aria-label="粒子造型">
      <button class="is-active" data-shape="heart" type="button"><span>♡</span><small>心动</small></button>
      <button data-shape="rose" type="button"><span>✿</span><small>玫瑰</small></button>
      <button data-shape="galaxy" type="button"><span>✦</span><small>星河</small></button>
      <button data-shape="name" type="button"><span>她</span><small>名字</small></button>
    </div>

    <aside class="gesture-card" id="gestureCard" aria-label="手势提示">
      <div class="gesture-icon" id="gestureIcon" aria-hidden="true"><span></span><span></span></div>
      <div><strong id="gestureTitle">试着捏合指尖</strong><small id="gestureHint">拇指与食指靠近</small></div>
    </aside>

    <div class="status" id="status"><span></span><b>等待开启</b></div>

    <nav class="controls" aria-label="体验控制">
      <button id="musicButton" type="button" aria-label="播放背景音乐" title="背景音乐">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13.2a3.6 3.6 0 1 1-2-3.2V7L11 8.3v7.9A3.6 3.6 0 1 1 9 13V18Z"/></svg>
        <span class="music-bars" aria-hidden="true"><i></i><i></i><i></i></span>
      </button>
      <button id="cameraButton" type="button" aria-label="开启或关闭摄像头" title="摄像头">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 7 10 5h4l1.5 2H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3.5ZM12 16.2a4.2 4.2 0 1 0 0-8.4 4.2 4.2 0 0 0 0 8.4Zm0-1.8a2.4 2.4 0 1 1 0-4.8 2.4 2.4 0 0 1 0 4.8Z"/></svg>
      </button>
      <button id="editButton" type="button" aria-label="定制文字" title="定制文字">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15.7 4.3 4 4L9 19H5v-4L15.7 4.3Zm1.4-1.4a2 2 0 0 0-2.8 0L3.6 13.6a2 2 0 0 0-.6 1.4v5a1 1 0 0 0 1 1h5a2 2 0 0 0 1.4-.6L21.1 9.7a2 2 0 0 0 0-2.8l-4-4Z"/></svg>
      </button>
      <button id="fullscreenButton" type="button" aria-label="全屏" title="全屏">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5v2H6v3H4Zm11-5h5v5h-2V6h-3V4ZM6 15v3h3v2H4v-5h2Zm12 0h2v5h-5v-2h3v-3Z"/></svg>
      </button>
    </nav>

    <div class="camera-preview" id="cameraPreview" aria-hidden="true">
      <video id="webcam" playsinline muted></video><span>LIVE</span>
    </div>

    <section class="camera-help" id="cameraHelp" role="alert" aria-live="assertive">
      <button class="help-close" id="helpClose" type="button" aria-label="关闭提示">×</button>
      <p class="eyebrow">CAMERA CHECK</p>
      <h3 id="cameraHelpTitle">摄像头没有启动</h3>
      <p id="cameraHelpText"></p>
      <div>
        <button class="secondary" id="retryCamera" type="button">重新尝试</button>
        <button class="primary compact" id="openExternal" type="button">在新窗口打开</button>
      </div>
    </section>

    <dialog id="editor">
      <form method="dialog" id="editorForm">
        <button class="close" value="cancel" aria-label="关闭">×</button>
        <p class="eyebrow">MAKE IT YOURS</p>
        <h3>写给她的话</h3>
        <label>她的名字<input id="toInput" maxlength="16" placeholder="特别的你" /></label>
        <label>想说的话<textarea id="messageInput" maxlength="60" rows="3" placeholder="见到你的那一刻，星星都落进了心里。"></textarea></label>
        <label>落款<input id="fromInput" maxlength="20" placeholder="一个想把浪漫送给你的人" /></label>
        <div class="form-actions">
          <button class="secondary" value="save" id="saveButton">保存效果</button>
          <button class="primary compact" value="share" id="shareButton">复制专属链接</button>
        </div>
        <p class="copy-feedback" id="copyFeedback" role="status"></p>
      </form>
    </dialog>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
